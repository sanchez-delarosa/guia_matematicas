<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo_pagina}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/estilo.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script>window.MACROS_KATEX = {{macros}};</script>
  <script defer src="../assets/app.js"></script>
</head>
<body class="pagina-capitulo">
  <header class="barra">
    <button class="boton-menu" type="button" aria-label="Abrir índice del capítulo" aria-controls="indice-lateral" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="marca-sitio" href="../index.html">
      <img src="../assets/logo.png" alt="" class="logo-barra" width="28" height="30" aria-hidden="true">
      <span>{{titulo_sitio}}</span>
    </a>
    <span class="barra-parte">{{parte}}</span>
  </header>

  <div class="disposicion">
    <aside id="indice-lateral" class="indice-lateral">
      <a class="volver" href="../index.html">← Todos los capítulos</a>
      <p class="indice-titulo">En este capítulo</p>
      {{indice_lateral}}
    </aside>
    <div class="velo" hidden></div>

    <main class="contenido">
      <article>
{{contenido}}
      </article>
      {{navegacion}}
    </main>
  </div>
  <div class="progreso" aria-hidden="true"></div>
</body>
</html>
